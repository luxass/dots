# CLIProxyAPI configuration
# Docs: https://help.router-for.me/configuration/basic.html
#
# Stowed to ~/.config/cliproxyapi/config.yaml. The Homebrew service reads
# /opt/homebrew/etc/cliproxyapi.conf, which `dot stow` symlinks to this file.
#
# IMPORTANT: auth-dir contains OAuth credentials and must NEVER be committed
# to git. It lives at ~/.config/cliproxyapi/auth (ignored via .gitignore).

# Bind to localhost only; this proxy is for local agent clients.
host: "127.0.0.1"

# Server port
port: 8317

# TLS settings for HTTPS. Disabled; localhost only.
tls:
  enable: false
  cert: ""
  key: ""

# Management API settings
remote-management:
  # Only localhost can access management endpoints (a key is still required).
  allow-remote: false

  # Management key. If a plaintext value is provided here, it will be hashed on startup.
  # All management requests (even from localhost) require this key.
  # Leave empty to disable the Management API entirely (404 for all /v0/management routes).
  secret-key: ""

  # Disable the bundled management control panel asset download and HTTP route when true.
  disable-control-panel: false

  # GitHub repository for the management control panel.
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# Authentication directory (supports ~ for home directory).
# OAuth login tokens land here; keep out of version control.
auth-dir: "~/.config/cliproxyapi/auth"

# API keys required from local clients. Replace with your own values.
api-keys:
  - "local-baby"

# Enable debug logging
debug: false

# Number of times to retry a request on 403, 408, 500, 502, 503, or 504.
request-retry: 3

# Maximum wait time in seconds for a cooled-down credential before triggering a retry.
max-retry-interval: 30

# Quota exceeded behavior
quota-exceeded:
  switch-project: true
  switch-preview-model: true

# Routing strategy for selecting credentials when multiple match.
routing:
  strategy: "round-robin"
