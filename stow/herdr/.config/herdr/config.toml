onboarding = false

[terminal]
default_shell = "fish"

[theme]
name = "terminal"
auto_switch = false

[keys]
settings = "prefix+shift+s"
detach = ["prefix+d", "prefix+q"]
workspace_picker = ["prefix+s", "prefix+w"]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
# Reserve prefix+o for document review.
open_notification_target = "prefix+i"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
focus_agent = "prefix+alt+1..9"
rename_tab = "prefix+comma"
copy_mode = "prefix+v"
split_vertical = "prefix+backslash"
split_horizontal = "prefix+enter"
zoom = "prefix+m"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected terminal text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as agent context"

# Keep prefix+m for pane zoom.
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in the current folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "Review the agent's last reply"

[ui]
sidebar_width = 32
right_click_passthrough_modifier = "ctrl"
prompt_new_workspace_name = true
agent_panel_sort = "priority"
status_indicators = "symbols"

[ui.sidebar.agents]
# Show reported reasons such as "Waiting for answers" beside the agent name.
rows = [["state_icon", "workspace", "tab"], ["agent", "state_text"]]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 52428800

[experimental]
# Saved terminal output can contain secrets. Keep session-history.json gitignored.
pane_history = true
