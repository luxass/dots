# Selected app preferences, applied by 'dot stow' and 'dot update'.
# Format: KEY TYPE VALUE. Types: string, int, float, bool, theme.
# No inline comments. Relaunch Rex after changes. Lua bindings reload live.
# The theme type resolves an imported theme name to its machine-local ID.
# While Rex runs, dot stow imports missing themes through the init.lua
# import_* actions, then selects them here.

# Keep built-in Tailscale enabled when Rex.app starts its managed server.
rex.server.tailnet-enabled bool true
# Lets 'rex do' run app actions, such as the theme import. Applies live.
rex.client.remoteControl bool true
# Restart the managed server automatically if it stops.
rex.server.automatic-restart-enabled bool true

Workspace.terminalFontName string Monaspace Krypton
Workspace.terminalFontPointSize int 14
Workspace.terminalAllowsLigatures bool false
Workspace.interfaceStyle string useTheme
Workspace.appearance string system
Workspace.darkThemeID theme catppuccin-macchiato
Workspace.lightThemeID theme catppuccin-latte
Workspace.tabStyle string vertical
Workspace.sidebarPosition string left
Workspace.sidebarWidth float 227
Workspace.sidebarShowsActivity bool false
Workspace.usesPaneGlass bool false
# Fade unfocused panes (surface and content), like Ghostty's default.
Workspace.inactivePaneFadeMode string both
Workspace.tabIconTintMode string off
