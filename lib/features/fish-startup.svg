<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title description">
  <title id="title">Fish performance across three optimization stages</title>
  <desc id="description">Grouped horizontal bars share a zero-based 0 to 120 millisecond scale. Original, startup fixes, and startup fixes plus the Starship override measure 72.7, 51.7, and 49.7 milliseconds for interactive startup; 69.9, 28.4, and 28.3 for noninteractive startup; and 109.8, 87.6, and 74.2 for startup plus prompt rendering. A separate interleaved comparison isolates the Starship override: 86.6 to 74.2 milliseconds, about 14 percent less time. Lower is better.</desc>
  <rect width="1000" height="710" rx="16" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172033">
    <text x="40" y="52" font-size="26" font-weight="700">Fish startup and prompt performance</text>
    <text x="40" y="81" font-size="15" fill="#526174">Three stages · medians in dots · milliseconds · lower is better</text>

    <rect x="40" y="106" width="14" height="14" rx="3" fill="#64748b"/>
    <text x="63" y="118" font-size="14">Original</text>
    <rect x="170" y="106" width="14" height="14" rx="3" fill="#3b82f6"/>
    <text x="193" y="118" font-size="14">Startup fixes</text>
    <rect x="345" y="106" width="14" height="14" rx="3" fill="#0d9488"/>
    <text x="368" y="118" font-size="14">Startup fixes + Starship override</text>

    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M280 150V510 M370 150V510 M460 150V510 M550 150V510 M640 150V510 M730 150V510 M820 150V510"/>
    </g>
    <path d="M280 150V510" stroke="#94a3b8" stroke-width="1"/>

    <text x="40" y="200" font-size="17" font-weight="600">Interactive startup</text>
    <text x="40" y="225" font-size="13" fill="#526174">No prompt rendering</text>
    <rect x="280" y="160" width="327.15" height="20" rx="3" fill="#64748b"/>
    <rect x="280" y="190" width="232.65" height="20" rx="3" fill="#3b82f6"/>
    <rect x="280" y="220" width="223.65" height="20" rx="3" fill="#0d9488"/>
    <text x="617.15" y="175" font-size="14">72.7 ms</text>
    <text x="522.65" y="205" font-size="14">51.7 ms</text>
    <text x="513.65" y="235" font-size="14" font-weight="600">49.7 ms</text>

    <text x="40" y="330" font-size="17" font-weight="600">Noninteractive startup</text>
    <text x="40" y="355" font-size="13" fill="#526174">Script execution</text>
    <rect x="280" y="290" width="314.55" height="20" rx="3" fill="#64748b"/>
    <rect x="280" y="320" width="127.8" height="20" rx="3" fill="#3b82f6"/>
    <rect x="280" y="350" width="127.35" height="20" rx="3" fill="#0d9488"/>
    <text x="604.55" y="305" font-size="14">69.9 ms</text>
    <text x="417.8" y="335" font-size="14">28.4 ms</text>
    <text x="417.35" y="365" font-size="14" font-weight="600">28.3 ms</text>

    <text x="40" y="460" font-size="17" font-weight="600">Startup + prompt</text>
    <text x="40" y="485" font-size="14" fill="#0f766e">32% less time vs. original</text>
    <rect x="280" y="420" width="494.1" height="20" rx="3" fill="#64748b"/>
    <rect x="280" y="450" width="394.2" height="20" rx="3" fill="#3b82f6"/>
    <rect x="280" y="480" width="333.9" height="20" rx="3" fill="#0d9488"/>
    <text x="784.1" y="435" font-size="14">109.8 ms</text>
    <text x="684.2" y="465" font-size="14">87.6 ms</text>
    <text x="623.9" y="495" font-size="14" font-weight="600">74.2 ms</text>

    <g font-size="13" fill="#526174" text-anchor="middle">
      <text x="280" y="535">0</text>
      <text x="370" y="535">20</text>
      <text x="460" y="535">40</text>
      <text x="550" y="535">60</text>
      <text x="640" y="535">80</text>
      <text x="730" y="535">100</text>
      <text x="820" y="535">120</text>
      <text x="550" y="565" font-size="14">Elapsed time (ms)</text>
    </g>

    <rect x="40" y="589" width="920" height="38" rx="6" fill="#f0fdfa"/>
    <text x="55" y="613" font-size="14" font-weight="600" fill="#0f766e">Same-session prompt comparison: 86.6 → 74.2 ms with the override · 14% less time</text>
    <text x="40" y="653" font-size="12" fill="#526174">Stage medians: 10 / 20 / 30 measured runs in separate sessions; three warm-up runs excluded per case.</text>
    <text x="40" y="674" font-size="12" fill="#526174">Startup-only variation between the last two stages is not attributed to the override. Terminal-app startup is excluded.</text>
    <text x="40" y="695" font-size="12" fill="#526174">The override targets Starship rendering only. Normal Git keeps filesystem monitoring enabled.</text>
  </g>
</svg>
